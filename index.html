<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020306">
<meta name="description" content="Choose any city and drift over its real streets in an endless night flight.">
<title>Nightflight</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%2304070c%22/%3E%3Cpath d=%22M7 23L16 8l9 15%22 fill=%22none%22 stroke=%22%23d7ad6d%22 stroke-width=%222%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="./vendor/maplibre-gl.css">
<link rel="stylesheet" href="./nightflight.css">
</head>
<body>
<div id="map" aria-label="Real-world night flight map"></div>
<canvas id="sky" tabindex="0" aria-label="Night flight. Drag to look up, down, or sideways. Arrow keys look around. Home resets the view." aria-keyshortcuts="ArrowUp ArrowDown ArrowLeft ArrowRight Home"></canvas>
<button class="place-button" id="choose-place" type="button" aria-haspopup="dialog" title="Choose a place (L)"><span class="place-dot" aria-hidden="true"></span><span id="place-name">Tokyo, Japan</span><span class="chevron" aria-hidden="true">⌄</span></button>
<div id="notice" class="notice" role="status">Loading the city…</div>
<div class="hud" id="hud" aria-label="Flight controls">
<button id="pause" type="button" aria-label="Pause" title="Pause (Space)" aria-pressed="false">Ⅱ</button>
<button id="reset-view" type="button" aria-label="Reset view" title="Reset view (Home)">↺</button>
<button id="fullscreen" type="button" aria-label="Fullscreen" title="Fullscreen (F)">⛶</button>
</div>
<div id="pick-controls" class="pick-controls" hidden><span id="pick-instruction">Click anywhere to choose your starting point.</span><div><button id="cancel-pick" type="button">Cancel</button><button id="confirm-pick" class="primary" type="button" disabled>Fly here</button></div></div>
<dialog id="places" aria-labelledby="places-title">
 <div class="dialog-heading"><div><p class="eyebrow">NIGHTFLIGHT</p><h1 id="places-title">Where shall we fly?</h1></div><button class="close" id="close-places" type="button" aria-label="Close place picker">×</button></div>
 <form id="search-form"><label class="sr-only" for="query">City, address, or latitude, longitude</label><div class="search-row"><input id="query" name="place" placeholder="City, address, or latitude, longitude" autocomplete="off" maxlength="200" required><button class="primary" id="search" type="submit">Search</button></div></form>
 <p id="search-status" class="search-status" role="status"></p>
 <div id="results" class="results" aria-label="Search results"></div>
 <div id="presets" class="presets" aria-label="Places to try"></div>
 <div class="route-setting"><label for="heading">Flight direction</label><select id="heading"><option value="0">North</option><option value="45">Northeast</option><option value="90" selected>East</option><option value="135">Southeast</option><option value="180">South</option><option value="225">Southwest</option><option value="270">West</option><option value="315">Northwest</option></select></div>
 <div class="dialog-actions"><button id="pick-map" type="button">Choose on the map</button><button id="copy-link" type="button">Copy flight link</button></div>
 <p class="fine-print">Real streets and coastlines, styled as night lights. Search by <a href="https://github.com/komoot/photon" target="_blank" rel="noopener noreferrer">Photon</a>. <a href="./offline.html">Offline flight</a></p>
</dialog>
<footer class="attribution"><a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">© OpenStreetMap contributors</a> · <a href="https://openmaptiles.org/" target="_blank" rel="noopener noreferrer">© OpenMapTiles</a> · <a href="https://openfreemap.org/" target="_blank" rel="noopener noreferrer">OpenFreeMap</a></footer>
<div class="sr-only" id="flight-status" role="status">Cruising</div>
<noscript><p class="fatal">Enable JavaScript to fly. <a href="./offline.html">Open the offline flight</a>.</p></noscript>
<script>
if(location.protocol==='file:'){const notice=document.getElementById('notice');notice.textContent='World flights need HTTP hosting. Use GitHub Pages or a local static server. ';const link=document.createElement('a');link.href='./offline.html';link.textContent='Open the offline flight';notice.append(link);}
</script>
<script type="module" src="./nightflight.mjs"></script>
</body>
</html>
